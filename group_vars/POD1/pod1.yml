---
# Pod 1: its own spine pair + leaf pairs, uplinked to the shared super-spine tier.
# To add POD3, copy this file's structure into group_vars/POD3/, bump the ASN
# and id blocks below (spine 65003 / leaf 65301-65350 / ids 3xx), and add the
# POD3 group to inventory.yml.

spine:
  defaults:
    platform: CHANGE_ME_PLATFORM_SKU
    bgp_as: 65001
    loopback_ipv4_pool: 10.255.0.0/16
    uplink_switches: [dc1-ss1, dc1-ss2]
    uplink_ipv4_pool: 10.255.128.0/24     # POD1-only p2p pool (spine <-> super-spine)
    # Pod-spines also relay EVPN routes between this pod's leafs and the rest
    # of the fabric via the super-spines (eBGP, next-hop-unchanged).
    evpn_route_servers: [dc1-ss1, dc1-ss2]
  nodes:
    - name: dc1-pod1-spine1
      id: 111
      mgmt_ip: 192.0.2.21/24
      uplink_switch_interfaces: [Ethernet1, Ethernet1]  # -> dc1-ss1/ss2 Et1
    - name: dc1-pod1-spine2
      id: 112
      mgmt_ip: 192.0.2.22/24
      uplink_switch_interfaces: [Ethernet2, Ethernet2]  # -> dc1-ss1/ss2 Et2

l3leaf:
  defaults:
    platform: CHANGE_ME_PLATFORM_SKU
    # Auto-assigned per-node from this range - unique ASN per leaf pair,
    # which is what makes the EVPN overlay eBGP.
    bgp_as: 65101-65150
    loopback_ipv4_pool: 10.255.0.0/16        # Loopback0 (underlay)
    vtep_loopback_ipv4_pool: 10.255.16.0/20  # Loopback1 (VTEP source)
    uplink_switches: [dc1-pod1-spine1, dc1-pod1-spine2]
    uplink_ipv4_pool: 10.255.128.0/24        # POD1-only p2p pool (leaf <-> spine)
    mlag_peer_ipv4_pool: 10.255.252.0/24
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24
    # Shared anycast gateway vMAC - safe to reuse fabric-wide.
    virtual_router_mac_address: 00:1c:73:00:00:99
    spanning_tree_mode: mstp
    spanning_tree_priority: 16384

  node_groups:
    - group: dc1-pod1-leaf1
      nodes:
        - name: dc1-pod1-leaf1a
          id: 121
          mgmt_ip: 192.0.2.31/24
          uplink_switch_interfaces: [Ethernet5, Ethernet5]  # -> pod1 spines Et5
        - name: dc1-pod1-leaf1b
          id: 122
          mgmt_ip: 192.0.2.32/24
          uplink_switch_interfaces: [Ethernet6, Ethernet6]  # -> pod1 spines Et6
    - group: dc1-pod1-leaf2
      nodes:
        - name: dc1-pod1-leaf2a
          id: 123
          mgmt_ip: 192.0.2.33/24
          uplink_switch_interfaces: [Ethernet7, Ethernet7]  # -> pod1 spines Et7
        - name: dc1-pod1-leaf2b
          id: 124
          mgmt_ip: 192.0.2.34/24
          uplink_switch_interfaces: [Ethernet8, Ethernet8]  # -> pod1 spines Et8
