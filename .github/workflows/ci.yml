---
name: CI - Build and Validate Fabric

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Render AVD configs and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible + pyavd
        run: pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check playbooks
        run: |
          ansible-playbook playbooks/build.yml --syntax-check
          ansible-playbook playbooks/deploy.yml --syntax-check
          ansible-playbook playbooks/validate.yml --syntax-check

      - name: Render structured configs, device configs, and docs
        run: ansible-playbook playbooks/build.yml

      - name: Upload generated configs and documentation
        uses: actions/upload-artifact@v4
        with:
          name: avd-build-output
          path: |
            intended/
            documentation/
          retention-days: 14
